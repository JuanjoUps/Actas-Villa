name: Revisar clasificación

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node revisar-clasificacion.js

      - id: comprobar
        run: |
          if [ -f "clasificacion-cambios.json" ]; then
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar cambios a Telegram
        if: steps.comprobar.outputs.hay_cambios == 'true'
        run: |
          node -e "
          const cambios = require('./clasificacion-cambios.json');
          cambios.forEach(c => {
            const flecha = c.subio ? '⬆️ SUBE' : '⬇️ BAJA';
            console.log(\`\${flecha} — \${c.categoria}: puesto \${c.posicionAnterior} -> \${c.posicionNueva} de \${c.totalEquipos} (\${c.puntos} puntos)\`);
          });
          " > mensajes-clasificacion.txt

          while IFS= read -r linea; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F message_thread_id="${{ secrets.TELEGRAM_TEMA_CLASIFICACION }}" \
              -F text="📊 ${linea}"
          done < mensajes-clasificacion.txt

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add clasificacion-estado.json
          git commit -m "Actualiza estado de clasificación" || echo "Nada que guardar"
          git push

      - name: Avisar por Telegram si algo falló
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_TEMA_ERRORES }}" \
            -F text="⚠️ Falló el workflow de clasificación. Revisa el log en GitHub Actions."