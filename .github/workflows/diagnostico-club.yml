name: Diagnóstico — ficha del club RFFM

# Solo se lanza a mano (no tiene cron), desde la pestaña Actions.
on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node buscar-club.js

      - uses: actions/upload-artifact@v4
        with:
          name: club-diagnostico
          path: club-diagnostico.json
