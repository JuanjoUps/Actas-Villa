name: Generar vídeo de resultado

on:
  workflow_dispatch:

  # Dos franjas: sábado/domingo (partidos del fin de semana) y
  # viernes por la tarde/noche (prebenjamín u otros que jueguen
  # ese día — como no sabemos la hora exacta, cubrimos una franja
  # ancha en vez de una hora fija).
  schedule:
    - cron: "0,30 10-21 * * 6,0"
    - cron: "0,30 15-22 * * 5"

jobs:
  generar-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: cd video && npm install

      - run: npx playwright install --with-deps chromium
        working-directory: video

      - run: node partidos-actuales.js

      - run: node procesar-actas.js

      - run: npm run video
        working-directory: video

      - id: comprobar
        run: |
          if [ -f "video-pendiente.json" ] && \
             [ -d "videos-generados" ] && \
             [ "$(ls -A videos-generados/*.mp4 2>/dev/null)" ]; then
            echo "hay_video=true" >> "$GITHUB_OUTPUT"
            echo "✓ Hay vídeo nuevo"
          else
            echo "hay_video=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ No hay vídeo nuevo"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.comprobar.outputs.hay_video == 'true'
        with:
          name: videos-generados
          path: videos-generados/*.mp4

      - name: Enviar vídeo a Telegram
        if: steps.comprobar.outputs.hay_video == 'true'
        run: |
          for archivo in videos-generados/*.mp4; do
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
              -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -F message_thread_id="${{ secrets.TELEGRAM_TEMA_RESULTADOS }}" \
              -F caption="⚽ Nuevo vídeo de resultado" \
              -F video="@${archivo}"
          done

      - if: steps.comprobar.outputs.hay_video == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USUARIO }}
          password: ${{ secrets.EMAIL_CLAVE }}
          subject: "Nuevo vídeo de resultado — C.D. Villa de Buitrago"
          to: ${{ secrets.EMAIL_DESTINO }}
          from: Actas Villa
          body: "Vídeo nuevo generado. Adjunto en este correo."
          attachments: videos-generados/*.mp4

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add estado.json estado-actas.json estado-videos.json escudos-cache/ partidos-video.json resultados-partidos/ 2>/dev/null || true
          git commit -m "Actualiza estado de actas y vídeos" || echo "Nada que guardar"
          git push

      - if: always()
        run: |
          if [ "${{ steps.comprobar.outputs.hay_video }}" = "true" ]; then
            echo "🎬 VÍDEO NUEVO PROCESADO Y ENVIADO"
          else
            echo "ℹ️ No había vídeo nuevo — no se ha enviado ningún correo."
          fi

      - name: Avisar por Telegram si algo falló
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_TEMA_ERRORES }}" \
            -F text="⚠️ Falló el workflow de vídeo de resultado. Revisa el log en GitHub Actions."
