<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba: campo 3D con Babylon.js</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #lienzo { width: 100%; height: 100%; display: block; touch-action: none; }
    #ayuda {
      position: fixed; top: 10px; left: 10px; color: #fff;
      font-family: Arial, sans-serif; font-size: 13px;
      background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px;
      max-width: 320px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="ayuda">
    <b>Prototipo de campo 3D (Babylon.js)</b><br />
    Arrastra con el ratón para mirar alrededor, rueda para acercar/alejar.
    La cámara también se mueve sola lentamente.
  </div>
  <canvas id="lienzo"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    // ============================================================
    // CONFIGURACIÓN
    // ============================================================

    const COLOR_LOCAL = "#1e8449";      // camiseta verde
    const COLOR_VISITANTE = "#f4c430";  // camiseta amarilla
    const COLOR_ORO = "#F4B400";

    // Jugadores de prueba: posición en el campo (x: -1 a 1 = ancho,
    // z: -1 a 1 = largo, portero cerca de z=-1) + dorsal + nombre.
    const JUGADORES_PRUEBA = [
      { x: 0,     z: -0.85, dorsal: 1,  nombre: "PORTERO" },
      { x: -0.55, z: -0.45, dorsal: 3,  nombre: "DIEGO" },
      { x: -0.2,  z: -0.45, dorsal: 4,  nombre: "LUCAS" },
      { x: 0.2,   z: -0.45, dorsal: 5,  nombre: "SERGIO" },
      { x: 0.55,  z: -0.45, dorsal: 2,  nombre: "RAUL" },
      { x: -0.4,  z: 0,     dorsal: 8,  nombre: "PABLO" },
      { x: 0.4,   z: 0,     dorsal: 6,  nombre: "ALVARO" },
      { x: -0.55, z: 0.45,  dorsal: 11, nombre: "HUGO" },
      { x: 0,     z: 0.45,  dorsal: 10, nombre: "JUANITO", capitan: true },
      { x: 0.55,  z: 0.45,  dorsal: 7,  nombre: "MARIO" },
      { x: 0,     z: 0.85,  dorsal: 9,  nombre: "MATEO" },
    ];

    const ANCHO_CAMPO = 22;

    // Camisetas que se balancean "al viento" — se rellena al crear
    // cada jugador y se anima en el bucle de render.
    const TORSOS_CON_VIENTO = [];
    const LARGO_CAMPO = 34;

    // ============================================================
    // MOTOR Y ESCENA
    // ============================================================

    const lienzo = document.getElementById("lienzo");
    const motor = new BABYLON.Engine(lienzo, true, { preserveDrawingBuffer: true, stencil: true });

    function crearEscena() {
      const escena = new BABYLON.Scene(motor);
      escena.clearColor = new BABYLON.Color4(0.02, 0.03, 0.02, 1);
      escena.fogMode = BABYLON.Scene.FOGMODE_EXP2;
      escena.fogDensity = 0.012;
      escena.fogColor = new BABYLON.Color3(0.02, 0.05, 0.03);

      // --- Cámara: ángulo de retransmisión de TV, con deriva lenta ---
      const camara = new BABYLON.ArcRotateCamera(
        "camara",
        -Math.PI / 2,   // alpha: mirando de frente
        Math.PI / 3.2,  // beta: inclinación, vista "desde la grada alta"
        38,             // radio: distancia
        new BABYLON.Vector3(0, 0, 0),
        escena
      );
      camara.attachControl(lienzo, true);
      camara.lowerRadiusLimit = 20;
      camara.upperRadiusLimit = 55;
      camara.wheelPrecision = 40;

      // --- Luces ---
      const luzAmbiente = new BABYLON.HemisphericLight(
        "luzAmbiente",
        new BABYLON.Vector3(0, 1, 0),
        escena
      );
      luzAmbiente.intensity = 0.4;
      luzAmbiente.groundColor = new BABYLON.Color3(0.05, 0.08, 0.05);

      // Luz direccional + sombras reales (como en tu referencia),
      // en vez del círculo oscuro pintado a mano de antes.
      const luzDireccional = new BABYLON.DirectionalLight(
        "luzDireccional",
        new BABYLON.Vector3(-0.3, -1, -0.4),
        escena
      );
      luzDireccional.position = new BABYLON.Vector3(20, 40, 20);
      luzDireccional.intensity = 1.1;

      const generadorSombras = new BABYLON.ShadowGenerator(1024, luzDireccional);
      generadorSombras.useBlurExponentialShadowMap = true;
      generadorSombras.blurKernel = 24;

      // 4 focos en torres finas de celosía, como los de tu campo
      // (no focos de estadio grandes)
      const posicionesFoco = [
        [-ANCHO_CAMPO * 0.65, 16, -LARGO_CAMPO * 0.55],
        [ANCHO_CAMPO * 0.65, 16, -LARGO_CAMPO * 0.55],
        [-ANCHO_CAMPO * 0.65, 16, LARGO_CAMPO * 0.55],
        [ANCHO_CAMPO * 0.65, 16, LARGO_CAMPO * 0.55],
      ];

      const capaBrillo = new BABYLON.GlowLayer("brillo", escena);
      capaBrillo.intensity = 0.6;

      const matPoste = new BABYLON.StandardMaterial("matPoste", escena);
      matPoste.diffuseColor = new BABYLON.Color3(0.55, 0.55, 0.58);
      matPoste.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

      const matBombilla = new BABYLON.StandardMaterial("matBombilla", escena);
      matBombilla.emissiveColor = new BABYLON.Color3(1, 1, 0.9);

      posicionesFoco.forEach((pos, i) => {
        const foco = new BABYLON.SpotLight(
          "foco" + i,
          new BABYLON.Vector3(pos[0], pos[1], pos[2]),
          new BABYLON.Vector3(-pos[0] * 0.4, -pos[1] + 2, -pos[2] * 0.4),
          Math.PI / 3,
          6,
          escena
        );
        foco.intensity = 0.5;
        foco.diffuse = new BABYLON.Color3(1, 1, 0.95);

        // Torre fina (no un poste macizo grueso)
        const torre = BABYLON.MeshBuilder.CreateCylinder(
          "torre" + i, { height: pos[1], diameterTop: 0.18, diameterBottom: 0.35, tessellation: 6 }, escena
        );
        torre.position = new BABYLON.Vector3(pos[0], pos[1] / 2, pos[2]);
        torre.material = matPoste;

        // Racimo de bombillas arriba (varias, no una sola bola)
        for (let b = 0; b < 6; b++) {
          const bombilla = BABYLON.MeshBuilder.CreateSphere(
            "bombilla" + i + "_" + b, { diameter: 0.35 }, escena
          );
          const angulo = (b / 6) * Math.PI * 2;
          bombilla.position = new BABYLON.Vector3(
            pos[0] + Math.cos(angulo) * 0.5,
            pos[1],
            pos[2] + Math.sin(angulo) * 0.5
          );
          bombilla.material = matBombilla;
        }
      });

      // --- Suelo del campo, con las líneas pintadas mediante textura ---
      const texturaCampo = crearTexturaCampo(escena);
      const suelo = BABYLON.MeshBuilder.CreateGround(
        "suelo", { width: ANCHO_CAMPO, height: LARGO_CAMPO }, escena
      );
      const matSuelo = new BABYLON.PBRMaterial("matSuelo", escena);
      matSuelo.albedoTexture = texturaCampo;
      matSuelo.bumpTexture = texturaCampo; // relieve falso: da textura de césped real
      matSuelo.bumpTexture.level = 0.4;
      matSuelo.roughness = 0.9;
      matSuelo.metallic = 0;
      suelo.material = matSuelo;
      suelo.receiveShadows = true;

      // --- Valla perimetral alta (malla), como en tu campo — NO
      // gradas de estadio ---
      const texturaValla = crearTexturaValla(escena);
      [-1, 1].forEach((lado) => {
        const valla = BABYLON.MeshBuilder.CreatePlane(
          "valla" + lado,
          { width: LARGO_CAMPO * 1.05, height: 5 },
          escena
        );
        valla.rotation.y = Math.PI / 2;
        valla.position = new BABYLON.Vector3(
          lado * (ANCHO_CAMPO / 2 + 0.6), 2.5, 0
        );
        const matValla = new BABYLON.StandardMaterial("matValla" + lado, escena);
        matValla.diffuseTexture = texturaValla;
        matValla.diffuseTexture.hasAlpha = true;
        matValla.useAlphaFromDiffuseTexture = true;
        matValla.backFaceCulling = false;
        matValla.diffuseColor = new BABYLON.Color3(0.75, 0.75, 0.75);
        valla.material = matValla;

        // Postes de la valla
        for (let p = -LARGO_CAMPO / 2; p <= LARGO_CAMPO / 2; p += 5) {
          const posteValla = BABYLON.MeshBuilder.CreateCylinder(
            "posteValla" + lado + p, { height: 5.2, diameter: 0.12 }, escena
          );
          posteValla.position = new BABYLON.Vector3(
            lado * (ANCHO_CAMPO / 2 + 0.6), 2.6, p
          );
          posteValla.material = matPoste;
        }
      });

      // --- Vallas publicitarias bajitas junto a la línea de banda ---
      const texturaPublicidad = crearTexturaPublicidad(escena);
      [-1, 1].forEach((lado) => {
        const valla = BABYLON.MeshBuilder.CreatePlane(
          "publicidad" + lado,
          { width: LARGO_CAMPO * 0.85, height: 1 },
          escena
        );
        valla.rotation.y = Math.PI / 2;
        valla.position = new BABYLON.Vector3(
          lado * (ANCHO_CAMPO / 2 + 0.15), 0.55, 0
        );
        const matPublicidad = new BABYLON.StandardMaterial("matPublicidad" + lado, escena);
        matPublicidad.diffuseTexture = texturaPublicidad;
        matPublicidad.backFaceCulling = false;
        valla.material = matPublicidad;
      });

      // --- Edificio blanco al fondo de una portería (como el tuyo) ---
      const edificio = BABYLON.MeshBuilder.CreateBox(
        "edificio", { width: ANCHO_CAMPO * 0.9, height: 7, depth: 4 }, escena
      );
      edificio.position = new BABYLON.Vector3(0, 3.5, -(LARGO_CAMPO / 2 + 5));
      const matEdificio = new BABYLON.StandardMaterial("matEdificio", escena);
      matEdificio.diffuseColor = new BABYLON.Color3(0.85, 0.85, 0.83);
      edificio.material = matEdificio;

      // --- Porterías (marco simple) ---
      [-1, 1].forEach((lado) => {
        crearPorteria(escena, lado * (LARGO_CAMPO / 2 - 1));
      });

      // --- Jugadores (billboards con la camiseta dibujada) ---
      JUGADORES_PRUEBA.forEach((j) => {
        crearJugador3D(
          escena,
          j,
          j.dorsal === 1 ? true : false,
          true, // esLocal (verde) para esta prueba
          generadorSombras
        );
      });

      // --- Animación de cámara: deriva lenta continua ---
      escena.registerBeforeRender(() => {
        camara.alpha += 0.0007;
      });

      // --- Camisetas al viento: cada torso se balancea con un
      // vaivén suave, con un desfase distinto por jugador para que
      // no se muevan todos exactamente igual (como el viento real). ---
      escena.registerBeforeRender(() => {
        const t = performance.now() / 1000;
        TORSOS_CON_VIENTO.forEach(({ mesh, fase }) => {
          mesh.rotation.z = Math.sin(t * 1.6 + fase) * 0.045;
          mesh.rotation.x = Math.sin(t * 1.1 + fase) * 0.025;
          const respiracion = 1 + Math.sin(t * 1.6 + fase) * 0.02;
          mesh.scaling.x = respiracion;
          mesh.scaling.z = respiracion;
        });
      });

      return escena;
    }

    // ============================================================
    // TEXTURA DEL CAMPO (rayas + líneas blancas dibujadas a mano)
    // ============================================================

    function crearTexturaValla(escena) {
      // Malla de valla: rejilla fina semitransparente, como la de
      // tu campo (no gradas).
      const w = 512, h = 128;
      const textura = new BABYLON.DynamicTexture(
        "texturaValla", { width: w, height: h }, escena
      );
      const ctx = textura.getContext();
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "rgba(200,200,200,0.5)";
      ctx.lineWidth = 1;
      const paso = 10;
      for (let x = 0; x <= w; x += paso) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y <= h; y += paso) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      textura.hasAlpha = true;
      textura.update();
      return textura;
    }

    function crearTexturaPublicidad(escena) {
      // Vallas publicitarias bajitas: franjas blancas con bloques
      // de color simulando logos de patrocinadores.
      const w = 1024, h = 128;
      const textura = new BABYLON.DynamicTexture(
        "texturaPublicidad", { width: w, height: h }, escena
      );
      const ctx = textura.getContext();
      ctx.fillStyle = "#f2f2f2";
      ctx.fillRect(0, 0, w, h);

      const colores = ["#1e8449", "#F4B400", "#174B2B", "#c0392b", "#2c3e50"];
      const numBloques = 8;
      for (let i = 0; i < numBloques; i++) {
        ctx.fillStyle = colores[i % colores.length];
        const anchoBloque = w / numBloques;
        ctx.fillRect(i * anchoBloque + 10, 20, anchoBloque - 20, h - 40);
      }
      textura.update();
      return textura;
    }

    function crearTexturaCampo(escena) {
      const tam = 1024;
      const textura = new BABYLON.DynamicTexture(
        "texturaCampo", { width: tam, height: tam * (LARGO_CAMPO / ANCHO_CAMPO) }, escena
      );
      const ctx = textura.getContext();
      const w = textura.getSize().width;
      const h = textura.getSize().height;

      // Rayas de corte de césped
      const franjas = 14;
      for (let i = 0; i < franjas; i++) {
        ctx.fillStyle = i % 2 === 0 ? "#1c5c33" : "#16492a";
        ctx.fillRect(0, (h / franjas) * i, w, h / franjas + 1);
      }

      // Grano de hierba: miles de motitas finas para que no se
      // vea liso — esto es lo que da la sensación de césped de
      // verdad en vez de un color plano.
      for (let i = 0; i < 26000; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const brillo = Math.random();
        ctx.fillStyle =
          brillo > 0.5
            ? "rgba(255,255,255," + (brillo - 0.5) * 0.12 + ")"
            : "rgba(0,0,0," + (0.5 - brillo) * 0.15 + ")";
        ctx.fillRect(x, y, 1.4, 1.4);
      }

      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 5;

      // Borde del campo
      ctx.strokeRect(20, 20, w - 40, h - 40);
      // Línea de medio campo
      ctx.beginPath();
      ctx.moveTo(20, h / 2);
      ctx.lineTo(w - 20, h / 2);
      ctx.stroke();
      // Círculo central
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, w * 0.12, 0, Math.PI * 2);
      ctx.stroke();
      // Áreas
      [0.12, 0.88].forEach((frac) => {
        ctx.strokeRect(w * 0.28, h * frac - (frac < 0.5 ? 0 : h * 0.12), w * 0.44, h * 0.12);
      });

      textura.update();
      return textura;
    }

    // ============================================================
    // PORTERÍA
    // ============================================================

    function crearPorteria(escena, z) {
      const mat = new BABYLON.StandardMaterial("matPorteria" + z, escena);
      mat.diffuseColor = new BABYLON.Color3(1, 1, 1);

      const ancho = 7.32 * 1.4;
      const alto = 2.44 * 1.4;
      const grosor = 0.12;

      const poste1 = BABYLON.MeshBuilder.CreateCylinder("p1" + z, { height: alto, diameter: grosor }, escena);
      poste1.position = new BABYLON.Vector3(-ancho / 2, alto / 2, z);
      poste1.material = mat;

      const poste2 = poste1.clone("p2" + z);
      poste2.position.x = ancho / 2;

      const larguero = BABYLON.MeshBuilder.CreateCylinder(
        "larguero" + z, { height: ancho, diameter: grosor }, escena
      );
      larguero.rotation.z = Math.PI / 2;
      larguero.position = new BABYLON.Vector3(0, alto, z);
      larguero.material = mat;
    }

    // ============================================================
    // JUGADOR 3D (billboard con camiseta dibujada)
    // ============================================================

    function crearJugador3D(escena, jugador, esPortero, esLocal, generadorSombras) {
      const posX = jugador.x * (ANCHO_CAMPO / 2 - 1.5);
      const posZ = jugador.z * (LARGO_CAMPO / 2 - 1.5);

      let colorCamiseta = esLocal
        ? new BABYLON.Color3(0.118, 0.518, 0.286)   // verde
        : new BABYLON.Color3(0.957, 0.769, 0.188);  // amarillo
      if (esPortero) colorCamiseta = new BABYLON.Color3(0.11, 0.11, 0.11);

      const raiz = new BABYLON.TransformNode("raiz" + jugador.dorsal, escena);
      raiz.position = new BABYLON.Vector3(posX, 0, posZ);

      // Material PBR para la camiseta: más realista con la luz
      // (aspecto de tela, no plástico).
      const matCamiseta = new BABYLON.PBRMaterial("matCamiseta" + jugador.dorsal, escena);
      matCamiseta.albedoColor = colorCamiseta;
      matCamiseta.roughness = 0.65;
      matCamiseta.metallic = 0.05;

      const matPiel = new BABYLON.PBRMaterial("matPiel" + jugador.dorsal, escena);
      matPiel.albedoColor = new BABYLON.Color3(0.86, 0.68, 0.53);
      matPiel.roughness = 0.8;
      matPiel.metallic = 0;

      const matPantalon = new BABYLON.PBRMaterial("matPantalon" + jugador.dorsal, escena);
      matPantalon.albedoColor = esPortero
        ? new BABYLON.Color3(0.11, 0.11, 0.11)
        : new BABYLON.Color3(0.08, 0.08, 0.08);
      matPantalon.roughness = 0.7;
      matPantalon.metallic = 0;

      const mallaJugador = []; // para añadir todas las piezas a las sombras de una vez

      // --- Torso (cilindro cónico: más ancho de hombros que de cintura) ---
      const torso = BABYLON.MeshBuilder.CreateCylinder(
        "torso" + jugador.dorsal,
        { diameterTop: 1.15, diameterBottom: 0.85, height: 1.5, tessellation: 14 },
        escena
      );
      torso.position.y = 1.55;
      torso.parent = raiz;
      torso.material = matCamiseta;
      mallaJugador.push(torso);

      // Guardamos referencia para el balanceo "al viento" en el
      // bucle de animación (ver registerBeforeRender más abajo).
      TORSOS_CON_VIENTO.push({ mesh: torso, fase: jugador.dorsal * 0.7 });

      // --- Cabeza ---
      const cabeza = BABYLON.MeshBuilder.CreateSphere(
        "cabeza" + jugador.dorsal, { diameter: 0.56, segments: 12 }, escena
      );
      cabeza.position.y = 2.58;
      cabeza.parent = raiz;
      cabeza.material = matPiel;
      mallaJugador.push(cabeza);

      // --- Brazos (dos cilindros inclinados hacia fuera) ---
      [-1, 1].forEach((lado) => {
        const brazo = BABYLON.MeshBuilder.CreateCylinder(
          "brazo" + lado + jugador.dorsal,
          { diameter: 0.24, height: 1.15, tessellation: 8 },
          escena
        );
        brazo.rotation.z = lado * (Math.PI / 7);
        brazo.position = new BABYLON.Vector3(lado * 0.72, 1.95, 0);
        brazo.parent = raiz;
        brazo.material = matCamiseta;
        mallaJugador.push(brazo);

        // Brazalete de capitán
        if (jugador.capitan) {
          const brazalete = BABYLON.MeshBuilder.CreateTorus(
            "brazalete" + jugador.dorsal,
            { diameter: 0.32, thickness: 0.06, tessellation: 12 },
            escena
          );
          brazalete.rotation.x = Math.PI / 2;
          brazalete.position = new BABYLON.Vector3(lado * 0.9, 1.75, 0);
          brazalete.parent = raiz;
          const matOro = new BABYLON.StandardMaterial("matBrazalete" + jugador.dorsal, escena);
          matOro.emissiveColor = new BABYLON.Color3(0.95, 0.7, 0);
          brazalete.material = matOro;
        }
      });

      // --- Piernas ---
      [-1, 1].forEach((lado) => {
        const pierna = BABYLON.MeshBuilder.CreateCylinder(
          "pierna" + lado + jugador.dorsal,
          { diameter: 0.3, height: 1.5, tessellation: 8 },
          escena
        );
        pierna.position = new BABYLON.Vector3(lado * 0.26, 0.75, 0);
        pierna.parent = raiz;
        pierna.material = matPantalon;
        mallaJugador.push(pierna);
      });

      // --- Etiqueta (dorsal + nombre), plana y siempre mirando a
      // cámara, flotando sobre el jugador ---
      const etiqueta = BABYLON.MeshBuilder.CreatePlane(
        "etiqueta" + jugador.dorsal, { width: 2.2, height: 0.7 }, escena
      );
      etiqueta.position.y = 3.35;
      etiqueta.parent = raiz;
      etiqueta.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

      const texturaEtiqueta = dibujarEtiquetaTextura(escena, jugador);
      const matEtiqueta = new BABYLON.StandardMaterial("matEtiqueta" + jugador.dorsal, escena);
      matEtiqueta.diffuseTexture = texturaEtiqueta;
      matEtiqueta.diffuseTexture.hasAlpha = true;
      matEtiqueta.useAlphaFromDiffuseTexture = true;
      matEtiqueta.emissiveColor = new BABYLON.Color3(1, 1, 1);
      matEtiqueta.backFaceCulling = false;
      etiqueta.material = matEtiqueta;

      // Sombra REAL proyectada por la luz direccional (ya no el
      // círculo negro pintado a mano de antes).
      if (generadorSombras) {
        mallaJugador.forEach((m) => generadorSombras.addShadowCaster(m));
      }
    }

    function dibujarEtiquetaTextura(escena, jugador) {
      // Ahora la camiseta es un cuerpo 3D de verdad; esta textura
      // solo dibuja la cartela flotante con dorsal + nombre.
      const w = 420, h = 130;
      const textura = new BABYLON.DynamicTexture(
        "texJ" + jugador.dorsal, { width: w, height: h }, escena, false
      );
      const ctx = textura.getContext();
      ctx.clearRect(0, 0, w, h);

      // Fondo redondeado semitransparente
      ctx.fillStyle = "rgba(5, 20, 12, 0.75)";
      ctx.beginPath();
      ctx.roundRect(4, 30, w - 8, h - 40, 16);
      ctx.fill();
      ctx.strokeStyle = "#F4B400";
      ctx.lineWidth = 3;
      ctx.stroke();

      // Dorsal (círculo dorado a la izquierda)
      ctx.fillStyle = "#F4B400";
      ctx.beginPath();
      ctx.arc(55, h / 2 + 5, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.font = "bold 34px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(jugador.dorsal, 55, h / 2 + 7);

      // Nombre
      ctx.fillStyle = "white";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "left";
      ctx.fillText(
        jugador.nombre + (jugador.capitan ? " (C)" : ""),
        105,
        h / 2 + 8
      );

      textura.update();
      return textura;
    }

    // ============================================================
    // ARRANQUE
    // ============================================================

    const escena = crearEscena();

    motor.runRenderLoop(() => {
      escena.render();
    });

    window.addEventListener("resize", () => {
      motor.resize();
    });
  </script>
</body>
</html>
