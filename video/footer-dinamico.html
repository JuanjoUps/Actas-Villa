<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Footer dinámico - vídeo partidos de la semana</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;800;900&display=swap" rel="stylesheet">

<style>
/*
  FOOTER DINÁMICO (valla publicitaria digital) — 1080 x 190 px.

  Bucle con N mensajes de 4 s cada uno (N = nº de elementos de SLIDES).
  El script del vídeo lo "congela" fotograma a fotograma (window.__setT)
  y lo pega sobre la parte de abajo del cartel.

  Para cambiar, quitar o añadir mensajes, edita SLIDES (en el <script>).
  Las animaciones se generan solas según cuántos mensajes haya.
*/
:root{
  --oro:#F4B400;
  --oro-claro:#FFD966;
  --verde:#14532D;
  --oscuro:#05140C;
  --P:12000ms;
  --Pc:12000ms;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:1080px; height:190px; overflow:hidden; background:#000; }

#footer{
  position:relative;
  width:1080px;
  height:190px;
  overflow:hidden;
  font-family:'Anton',sans-serif;
  text-transform:uppercase;
  color:#fff;
  background:var(--oscuro);
}

.fondo{
  position:absolute; inset:0;
  background:linear-gradient(90deg,
    #05140C 0%, #14532D 25%, #05140C 50%, #3b3208 75%, #05140C 100%);
  background-size:200% 100%;
  animation:fondo var(--P) linear infinite;
}
@keyframes fondo{ from{ background-position:0% 0; } to{ background-position:100% 0; } }

.halo{
  position:absolute; left:50%; top:50%;
  width:1100px; height:260px; margin:-130px 0 0 -550px;
  background:radial-gradient(ellipse at center, rgba(244,180,0,.35), rgba(244,180,0,0) 65%);
  animation:halo 4s ease-in-out infinite;
}
@keyframes halo{ 0%,100%{ opacity:.25; transform:scale(.9);} 50%{ opacity:.75; transform:scale(1.1);} }

.brillo{
  position:absolute; top:-20px; bottom:-20px; width:200px; left:0;
  background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.38), rgba(255,255,255,0));
  transform:translateX(-300px) skewX(-18deg);
  animation:brillo 4s ease-in-out infinite;
  z-index:6;
}
@keyframes brillo{
  0%{ transform:translateX(-300px) skewX(-18deg); }
  45%,100%{ transform:translateX(1400px) skewX(-18deg); }
}

/* Línea dorada superior FIJA (sin luces en movimiento) */
.borde{
  position:absolute; left:0; right:0; top:0; height:4px; z-index:7;
  background:var(--oro);
}

.slide{
  position:absolute; inset:4px 0 0 0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0;
  animation:slide var(--P) linear infinite;
  animation-delay:calc(var(--k) * 4s - var(--P));
  z-index:4;
}

.linea{ white-space:nowrap; display:block; }
.l{ display:inline-block; will-change:transform; }
.esp{ display:inline-block; width:.28em; }

.l{
  animation:letra var(--P) linear infinite;
  animation-delay:calc(var(--d) * 1ms - var(--P));
}
.l.blanco{ animation-name:letraB; }

.oro{ color:var(--oro); text-shadow:0 3px 0 rgba(0,0,0,.5); }
.blanco{ color:#fff; text-shadow:2px 3px 0 rgba(0,0,0,.45); }

.t1{ font-size:49px; line-height:1; letter-spacing:.02em; }
.t1 + .t1{ margin-top:2px; }
.t2{ font-size:46px; line-height:1; letter-spacing:.02em; }
.t2 + .t2{ margin-top:2px; }

.caja{
  position:relative;
  padding:12px 34px 10px;
  background:linear-gradient(180deg,#FFC933,#F4B400 55%,#D99A00);
  color:#071A0F;
  box-shadow:5px 6px 0 rgba(0,0,0,.4), 0 0 28px rgba(244,180,0,.65);
  transform:rotate(-1.5deg);
  animation:caja var(--P) linear infinite;
  animation-delay:calc(var(--k) * 4s - var(--P));
  overflow:hidden;
}
.caja .linea{ font-size:44px; line-height:1.02; letter-spacing:.02em; }
.caja .l{ color:#071A0F; }

/* Variante con QR a la derecha */
.slide.conqr{ padding-right:250px; }
.slide.conqr .cinta{ right:250px; }
.qr{
  position:absolute; right:36px; top:14px; width:166px; height:162px;
  background:#fff; border-radius:10px; padding:0;
  box-shadow:0 0 0 4px var(--oro), 0 0 26px rgba(244,180,0,.8);
  overflow:hidden;
}
.qr img{ width:100%; height:100%; display:block; object-fit:contain; }
/* Balones de fútbol botando con las cifras de la lotería */
.slide.conbolas{ padding-left:400px; }
.abs{ animation-duration:var(--P); animation-timing-function:linear; animation-iteration-count:infinite; }
.bolas{ position:absolute; left:18px; top:0; width:440px; height:186px; }
.bola{
  position:absolute; bottom:18px; width:74px; height:74px;
  transform-origin:50% 100%;
  animation:bote 800ms linear infinite;
  animation-delay:calc(var(--i) * -160ms);
}
.cuerpo{
  position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #fff 0%, #f2f2f2 45%, #bdbdbd 100%);
  box-shadow:inset -5px -7px 10px rgba(0,0,0,.35), 0 0 0 2px #222;
  overflow:hidden;
}
.pent{
  position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px;
  background:#111; clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);
}
.cifra{
  position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px;
  border-radius:50%; background:#fff; border:3px solid var(--oro);
  display:flex; align-items:center; justify-content:center;
  font-family:'Anton',sans-serif; font-size:30px; line-height:1; color:var(--verde);
}
.sombra{
  position:absolute; bottom:10px; width:70px; height:12px; border-radius:50%;
  background:rgba(0,0,0,.55);
  animation:sombra 800ms linear infinite;
  animation-delay:calc(var(--i) * -160ms);
}
@keyframes bote{
  0%   { transform:translateY(0)     scale(1.14,.82); animation-timing-function:ease-out; }
  10%  { transform:translateY(-8px)  scale(.97,1.04); animation-timing-function:ease-out; }
  50%  { transform:translateY(-92px) scale(1,1);      animation-timing-function:ease-in; }
  90%  { transform:translateY(-8px)  scale(.97,1.04); animation-timing-function:ease-in; }
  100% { transform:translateY(0)     scale(1.14,.82); }
}
@keyframes sombra{
  0%,100%{ transform:scale(1.1); opacity:.6; }
  50%    { transform:scale(.45); opacity:.2; }
}
.pelota{ position:absolute; bottom:18px; width:74px; height:74px; left:0; }
.lotb{
  position:absolute; bottom:18px; width:74px; height:74px; border-radius:50%; opacity:0;
  background:radial-gradient(circle at 34% 28%, #FFF3B0 0%, #FFC933 45%, #C98F00 100%);
  box-shadow:inset -5px -7px 10px rgba(0,0,0,.35), 0 0 0 2px #7a5a00;
  transform-origin:50% 100%;
}
.lotb .cifra{ border:3px solid #7a5a00; }
.sh{ position:absolute; bottom:10px; left:0; width:70px; height:12px; border-radius:50%; background:rgba(0,0,0,.55); }
.fijo{ opacity:0; }
.t3{ font-size:40px; line-height:1.02; letter-spacing:.02em; }
.t3 + .t3{ margin-top:3px; }
.slide.conimg{ padding-left:290px; }
.decimo{
  position:absolute; left:34px; top:24px; width:230px; height:auto;
  transform:rotate(-4deg);
  box-shadow:0 6px 14px rgba(0,0,0,.6), 0 0 0 3px #fff;
  border-radius:4px; display:block;
}
.grande.med{ font-size:54px; }
.grande{ font-size:78px; line-height:1; letter-spacing:.03em; margin-top:-8px; }
.cinta{
  position:absolute; left:0; right:0; bottom:10px; height:34px;
  overflow:hidden;
  background:rgba(0,0,0,.55);
  border-top:2px solid var(--oro);
  border-bottom:2px solid var(--oro);
}
.cinta .pista{
  display:flex; width:max-content; height:100%; align-items:center;
  font-family:'Barlow Condensed',sans-serif; font-weight:800;
  font-size:24px; letter-spacing:.08em; color:var(--oro-claro);
  animation:cinta var(--Pc) linear infinite;
}
.cinta .pista span{ padding:0 22px; white-space:nowrap; }
@keyframes cinta{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
</style>
</head>
<body>

<div id="footer">
  <div class="fondo"></div>
  <div class="halo"></div>
  <div id="escena"></div>
  <div class="brillo"></div>
  <div class="borde"></div>
</div>

<script>
/* =========================================================
   MENSAJES — edítalos aquí (cada uno dura 4 s)
   Tipos: "texto" (líneas), "caja" (caja dorada), "grande" (+ cinta)
   Colores de letra: "blanco" / "oro"
   ========================================================= */
const SLIDES = [
  { tipo:"texto", clase:"t3", img:"decimo", lineas:[
      [ ["YA DISPONIBLE","oro"] ],
      [ ["LOTERÍA DE NAVIDAD DEL VILLA","blanco"] ],
      [ ["Nº 67512 · 22€","oro"] ]
  ]},
  { tipo:"grande", texto:[ ["¡HAZTE ","blanco"], ["SOCIO ","oro"], ["DEL VILLA!","blanco"] ], med:true,
    cinta:"★ ESCANEA EL QR ★ TU CARNET DIGITAL ★ APOYA A TU CLUB ★ ",
    qr:true
  },
  { tipo:"caja", lineas:[
      [ ["PATROCINA NUESTRO"] ],
      [ ["CONTENIDO SEMANAL"] ]
  ]}
];

/* Mensajes disponibles por si quieres cambiarlos o añadirlos a SLIDES */
const EXTRAS = [
  { tipo:"texto", clase:"t3", img:"decimo", lineas:[
      [ ["YA DISPONIBLE","oro"] ],
      [ ["LOTERÍA DE NAVIDAD DEL VILLA","blanco"] ],
      [ ["Nº 67512 · 22€","oro"] ]
  ]},
  { tipo:"texto", clase:"t1", lineas:[
      [ ["¿QUIERES QUE TU MARCA","blanco"] ],
      [ ["APAREZCA ","blanco"], ["CADA SEMANA?","oro"] ]
  ]},
  { tipo:"caja", lineas:[
      [ ["PATROCINA NUESTRO CONTENIDO"] ],
      [ ["DE PARTIDOS"] ]
  ]},
  { tipo:"grande", texto:[ ["TU MARCA ","blanco"], ["AQUÍ","oro"] ],
    cinta:"★ C.D. VILLA DE BUITRAGO ★ PATROCINA LA JORNADA ★ TU MARCA EN CADA PARTIDO ★ "
  }
];

const SLIDE_MS  = 4000;
const PASO_LETRA = 38;
let _ini = 0; SLIDES.forEach(sl => { sl._ini = _ini; _ini += (sl.slots || 1); });
const N  = _ini;
const P  = N * SLIDE_MS;
const Pc = P / Math.ceil(P / 12000);

document.documentElement.style.setProperty("--P",  P  + "ms");
document.documentElement.style.setProperty("--Pc", Pc + "ms");

function kf(nombre, paradas){
  const pct = ms => (ms / P * 100).toFixed(4) + "%";
  const filas = paradas.map(([ms, css]) => `  ${pct(ms)}{ ${css} }`).join("\n");
  return `@keyframes ${nombre}{\n${filas}\n}\n`;
}

const IN0 = "opacity:0; transform:translateY(-34px) scale(2.4) rotate(-8deg); filter:blur(5px);";
const GLOW1 = "transform:scale(1.14); filter:brightness(1.55) drop-shadow(0 0 10px rgba(255,217,102,.95));";
const GLOW2 = "transform:scale(1.1); filter:brightness(1.4) drop-shadow(0 0 8px rgba(255,255,255,.9));";

let css = "";

css += kf("slide", [
  [0, "opacity:0;"], [300, "opacity:1;"], [3650, "opacity:1;"], [3960, "opacity:0;"], [P, "opacity:0;"]
]);

css += kf("letra", [
  [0,    IN0],
  [192,  "opacity:1; transform:translateY(5px) scale(.92) rotate(2deg); filter:blur(0);"],
  [312,  "transform:translateY(0) scale(1) rotate(0); filter:none;"],
  [960,  "transform:scale(1); filter:none;"],
  [1200, GLOW1],
  [1560, "transform:scale(1); filter:none;"],
  [2280, "transform:scale(1); filter:none;"],
  [2520, GLOW2],
  [2880, "transform:scale(1); filter:none;"],
  [3600, "opacity:1; transform:scale(1); filter:none;"],
  [3960, "opacity:0; transform:translateY(24px) scale(.7);"],
  [P,    "opacity:0;"]
]);

css += kf("letraB", [
  [0,    IN0 + " color:#fff;"],
  [192,  "opacity:1; transform:translateY(5px) scale(.92) rotate(2deg); filter:blur(0);"],
  [312,  "transform:translateY(0) scale(1) rotate(0); filter:none;"],
  [960,  "transform:scale(1); filter:none; color:#fff;"],
  [1200, "transform:scale(1.14); filter:brightness(1.3) drop-shadow(0 0 10px rgba(255,217,102,.95)); color:var(--oro-claro);"],
  [1560, "transform:scale(1); filter:none; color:#fff;"],
  [2280, "transform:scale(1); filter:none; color:#fff;"],
  [2520, "transform:scale(1.1); filter:brightness(1.2) drop-shadow(0 0 8px rgba(244,180,0,.95)); color:var(--oro);"],
  [2880, "transform:scale(1); filter:none; color:#fff;"],
  [3600, "opacity:1; transform:scale(1); filter:none; color:#fff;"],
  [3960, "opacity:0; transform:translateY(24px) scale(.7);"],
  [P,    "opacity:0;"]
]);

const R = "rotate(-1.5deg)";
const SOMBRA = "box-shadow:5px 6px 0 rgba(0,0,0,.4), 0 0 46px rgba(255,217,102,1);";
css += kf("caja", [
  [0,    `transform:${R} scale(.4); opacity:0;`],
  [290,  `transform:${R} scale(1.12); opacity:1;`],
  [480,  `transform:${R} scale(1);`],
  [1300, `transform:${R} scale(1.04); ${SOMBRA}`],
  [1900, `transform:${R} scale(1);`],
  [2600, `transform:${R} scale(1.04); ${SOMBRA}`],
  [3200, `transform:${R} scale(1);`],
  [3650, `transform:${R} scale(1); opacity:1;`],
  [3960, `transform:${R} scale(.6); opacity:0;`],
  [P,    "opacity:0;"]
]);

const estilo = document.createElement("style");
estilo.textContent = css;
document.head.appendChild(estilo);

const ESCENA = document.getElementById("escena");

function letras(texto, clase, k, base){
  const cont = document.createDocumentFragment();
  let i = base;
  for (const ch of texto){
    if (ch === " "){
      const e = document.createElement("span");
      e.className = "esp";
      cont.appendChild(e);
      continue;
    }
    const s = document.createElement("span");
    s.className = "l " + (clase || "");
    s.textContent = ch;
    s.style.setProperty("--d", (k * SLIDE_MS + 120 + i * PASO_LETRA).toString());
    cont.appendChild(s);
    i++;
  }
  return { nodo: cont, siguiente: i };
}

function linea(partes, k, base, extra){
  const div = document.createElement("div");
  div.className = "linea " + (extra || "");
  let i = base;
  for (const [t, c] of partes){
    const r = letras(t, c, k, i);
    div.appendChild(r.nodo);
    i = r.siguiente;
  }
  return { div, siguiente: i };
}

SLIDES.forEach((sl) => {
  const k = sl._ini;
  const cont = document.createElement("div");
  cont.className = "slide";
  cont.style.setProperty("--k", k);

  if (sl.tipo === "texto"){
    let i = 0;
    sl.lineas.forEach(l => { const r = linea(l, k, i, sl.clase || "t1"); cont.appendChild(r.div); i = r.siguiente; });
  }

  if (sl.tipo === "bolas1"){
    cont.classList.add("conbolas");
    let i = 0;
    sl.lineas.forEach(l => { const r = linea(l, k, i, sl.clase || "t3"); cont.appendChild(r.div); i = r.siguiente; });
    const cont2 = document.createElement("div");
    cont2.className = "bolas";
    [...sl.cifras].forEach((c, n) => {
      const x = 4 + n * 84;
      const sh = document.createElement("div");
      sh.className = "sombra"; sh.style.left = (x - 2) + "px"; sh.style.setProperty("--i", n);
      cont2.appendChild(sh);
      const b = document.createElement("div");
      b.className = "bola"; b.style.left = x + "px"; b.style.setProperty("--i", n);
      const cu = document.createElement("div"); cu.className = "cuerpo";
      for (let a = 0; a < 5; a++){
        const pt = document.createElement("span"); pt.className = "pent";
        pt.style.transform = `rotate(${a*72 + 20}deg) translateY(-34px)`;
        cu.appendChild(pt);
      }
      const ci = document.createElement("div"); ci.className = "cifra"; ci.textContent = c;
      cu.appendChild(ci); b.appendChild(cu); cont2.appendChild(b);
    });
    cont.appendChild(cont2);
  }

  if (sl.tipo === "bolas"){
    cont.classList.add("conbolas");
    /* Todo con fotogramas absolutos (ms desde el inicio del mensaje) */
    const T0 = sl._ini * SLIDE_MS, DUR = (sl.slots || 1) * SLIDE_MS;
    const pc = t => ((T0 + t) / P * 100).toFixed(4) + "%";
    const akf = (nombre, pts, base) => {
      /* pts: [[t, css]] ; antes y después del mensaje: base */
      let r = `@keyframes ${nombre}{\n  0%{ ${base} }\n`;
      pts.forEach(([t, c]) => { r += `  ${pc(t)}{ ${c} }\n`; });
      r += `  100%{ ${base} }\n}\n`;
      return r;
    };
    let css2 = "";
    const OFF = "opacity:0;";

    /* aparición/desaparición del mensaje completo */
    css2 += akf("bs_slide", [[0,"opacity:0;"],[300,"opacity:1;"],[DUR-350,"opacity:1;"],[DUR-40,"opacity:0;"]], OFF);
    cont.style.animation = "bs_slide " + P + "ms linear infinite";
    cont.style.animationDelay = "0ms";

    /* texto de la derecha: cada línea entra con zoom, una tras otra */
    sl.lineas.forEach((l, n) => {
      const d = linea(l, k, 0, "t3 fijo");
      d.div.querySelectorAll(".l").forEach(x => { x.style.animation = "none"; x.style.opacity = 1; x.style.transform = "none"; });
      const t1 = 600 + n * 600;
      css2 += akf("bs_t" + n, [
        [t1,"opacity:0; transform:scale(1.6) translateY(-16px);"],
        [t1+280,"opacity:1; transform:scale(.96);"],
        [t1+420,"opacity:1; transform:scale(1);"],
        [DUR-350,"opacity:1; transform:scale(1);"]
      ], "opacity:0;");
      d.div.style.animation = `bs_t${n} ${P}ms linear infinite`;
      cont.appendChild(d.div);
    });

    const caja2 = document.createElement("div");
    caja2.className = "bolas";
    const xs = [...sl.cifras].map((c, n) => 6 + n * 84);
    const HOP = 1200, H = 96, START = 500;
    const posX = h => (h < 0 ? -90 : xs[h]);

    /* balón de fútbol: 5 saltos de izquierda a derecha */
    const fut = document.createElement("div"); fut.className = "pelota";
    const cu = document.createElement("div"); cu.className = "cuerpo";
    for (let a = 0; a < 5; a++){
      const pt = document.createElement("span"); pt.className = "pent";
      pt.style.transform = `rotate(${a*72 + 20}deg) translateY(-34px)`;
      cu.appendChild(pt);
    }
    fut.appendChild(cu);
    const sh = document.createElement("div"); sh.className = "sh";
    let pf = [], ps = [];
    const FIN = START + 5 * HOP;
    for (let t = START; t <= FIN; t += 40){
      const h = Math.min(4, Math.floor((t - START) / HOP));
      const u = Math.min(1, (t - START - h * HOP) / HOP);
      const x = posX(h-1) + (posX(h) - posX(h-1)) * u;
      const y = -H * 4 * u * (1 - u);
      const sq = (u < .08 || u > .92) ? "scale(1.14,.84)" : "scale(1,1)";
      pf.push([t, `opacity:1; transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${(t-START)*0.35}deg) ${sq};`]);
      const sc = 1.1 - 0.65 * (4 * u * (1 - u));
      ps.push([t, `opacity:${(0.6 - 0.4*4*u*(1-u)).toFixed(2)}; transform:translate(${(x-2).toFixed(1)}px,0) scale(${sc.toFixed(2)});`]);
    }
    pf.push([FIN+1, "opacity:0;"]);  ps.push([FIN+1, "opacity:0;"]);
    css2 += akf("bs_fut", [[0,"opacity:0;"],...pf], OFF);
    css2 += akf("bs_sh",  [[0,"opacity:0;"],...ps], OFF);
    fut.style.animation = `bs_fut ${P}ms linear infinite`;
    sh.style.animation = `bs_sh ${P}ms linear infinite`;
    caja2.appendChild(sh); caja2.appendChild(fut);

    /* bolas de lotería: aparecen con un "pop" donde aterriza el balón */
    [...sl.cifras].forEach((c, n) => {
      const tl = START + (n + 1) * HOP;
      const b = document.createElement("div"); b.className = "lotb";
      b.style.left = xs[n] + "px";
      const ci = document.createElement("div"); ci.className = "cifra"; ci.textContent = c;
      b.appendChild(ci);
      const pts = [
        [tl-1, "opacity:0; transform:scale(0);"],
        [tl,   "opacity:1; transform:scale(0.2,1.4);"],
        [tl+160,"opacity:1; transform:scale(1.3,.8);"],
        [tl+340,"opacity:1; transform:scale(.92,1.1);"],
        [tl+500,"opacity:1; transform:scale(1,1); filter:none;"],
        [DUR-1000 + n*60, "opacity:1; transform:scale(1,1) translateY(0);"],
        [DUR-1000 + n*60 + 220, "opacity:1; transform:scale(1,1) translateY(-26px); filter:brightness(1.3);"],
        [DUR-1000 + n*60 + 440, "opacity:1; transform:scale(1.1,.88) translateY(0); filter:none;"],
        [DUR-1000 + n*60 + 560, "opacity:1; transform:scale(1,1) translateY(0);"],
        [DUR-350, "opacity:1; transform:scale(1,1);"]
      ];
      css2 += akf("bs_l" + n, pts, OFF);
      b.style.animation = `bs_l${n} ${P}ms linear infinite`;
      caja2.appendChild(b);
    });

    const est2 = document.createElement("style");
    est2.textContent = css2;
    document.head.appendChild(est2);
    cont.appendChild(caja2);
  }

  if (sl.tipo === "caja"){
    const caja = document.createElement("div");
    caja.className = "caja";
    caja.style.setProperty("--k", k);
    let i = 0;

window.__setT = function(ms){
  const todas = document.getAnimations
    ? document.getAnimations()
    : Array.from(document.querySelectorAll("*")).flatMap(e => e.getAnimations ? e.getAnimations() : []);
  todas.forEach(a => { a.pause(); a.currentTime = ms; });
};
window.__DURACION_MS = P;

/* Espera a las fuentes (máx. 6 s) y marca la página como lista pase lo que pase */
const fuentes = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
Promise.race([fuentes, new Promise(r => setTimeout(r, 6000))])
  .catch(() => {})
  .then(() => {
    /* Con ?live=1 (vídeo del resultado) la animación corre sola en tiempo real;
       sin él (vídeo de la semana) se congela en t=0 para grabarla fotograma a fotograma. */
    const enVivo = /[?&]live=1/.test(location.search);
    if (!enVivo) { try { window.__setT(0); } catch (e) { console.error(e); } }
    window.__listo = true;
  });
</script>
