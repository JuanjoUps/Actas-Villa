<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>PRUEBA — alineación con dos fases (no toca el vídeo real)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    background: #0F2716;
    font-family: -apple-system, Roboto, Arial, sans-serif;
  }

  /* --- Réplica exacta de la caja del campo real (794x640,
     dentro de un lienzo con el mismo aspecto que el vídeo) --- */
  #envoltura {
    width: 1080px;
    padding: 40px;
  }
  #campo {
    position: relative;
    width: 794px;
    height: 640px;
    border-radius: 14px;
    overflow: hidden;
    background: #04140a;
    border: 4px solid #F4B400;
  }
  #campo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .controles {
    padding: 20px 40px;
    color: #F6EFDD;
  }
  .controles button {
    padding: 10px 18px;
    margin-right: 10px;
    border: none;
    border-radius: 8px;
    background: #F2A100;
    color: #0F2716;
    font-weight: 700;
    cursor: pointer;
  }
  .controles select {
    padding: 8px;
    border-radius: 6px;
    margin-right: 10px;
  }

  /* --- Tarjeta de jugador — idéntica a la propuesta para el vídeo real --- */
  .jugador {
    position: absolute;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: top 1.1s ease, left 1.1s ease;
  }
  @keyframes aparecerJugador {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.5) translateY(10px); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1) translateY(0); }
  }
  .jugador.aparece {
    animation: aparecerJugador 0.45s cubic-bezier(.34, 1.56, .64, 1) forwards;
  }
  .tarjeta-jugador {
    position: relative;
    width: 78px;
    height: 104px;
    background: rgba(8, 8, 8, 0.55);
    border: 2px solid rgba(244, 196, 48, 0.7);
    border-radius: 11px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
  }
  .tarjeta-jugador .camiseta-fondo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center 60%;
  }
  .tarjeta-jugador .dorsal-tarjeta {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 25px; font-weight: 900; color: #F4B400;
    text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
    line-height: 1;
  }
  .tarjeta-jugador .nombre-tarjeta {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.72); color: #F6EFDD;
    font-size: 10.5px; font-weight: 700; text-align: center;
    padding: 3px 2px; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tarjeta-jugador .capitan-tarjeta {
    position: absolute; top: 4px; right: 4px;
    width: 17px; height: 17px; border-radius: 50%;
    background: #ffd700; border: 1.5px solid #333; color: #222;
    font-size: 10px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<div class="controles">
  <button id="btnLocal">Ver campo LOCAL</button>
  <button id="btnGenerico">Ver campo VISITANTE (genérico)</button>
  <button id="btnReiniciar">Reiniciar animación</button>
  <span id="estadoFase" style="margin-left:20px;"></span>
</div>

<div id="envoltura">
  <div id="campo">
    <img id="fondo" src="assets/campo-local-v4.jpg" alt="" />
    <div id="jugadores"></div>
  </div>
</div>

<script>
  // Mismos datos y funciones que usa el vídeo real — copiados aquí
  // tal cual para no depender de animacion.js ni tocarlo.
  const alineacion = [
    {dorsal:"1",nombre:"González Pérez",portero:true,capitan:false},
    {dorsal:"4",nombre:"Martín Ruiz",portero:false,capitan:false},
    {dorsal:"5",nombre:"Sánchez López",portero:false,capitan:true},
    {dorsal:"6",nombre:"López García",portero:false,capitan:false},
    {dorsal:"8",nombre:"García Díaz",portero:false,capitan:false},
    {dorsal:"10",nombre:"Ruiz Torres",portero:false,capitan:false},
    {dorsal:"7",nombre:"Díaz Romero",portero:false,capitan:false},
    {dorsal:"11",nombre:"Moreno Vega",portero:false,capitan:false},
    {dorsal:"9",nombre:"Torres Sanz",portero:false,capitan:false},
    {dorsal:"17",nombre:"Romero Alba",portero:false,capitan:false},
    {dorsal:"15",nombre:"Vega Ortiz",portero:false,capitan:false},
  ];

  const ALTURAS_AMPLIO   = { portero: "88%", defensa: "68%", centrocampista: "45%", delantero: "22%" };
  // Cada fila necesita al menos ~16% de hueco entre sí (la tarjeta
  // mide 104px de 640px de caja = 16.25%), si no se solapan.
  const ALTURAS_COMPACTO = { portero: "88%", defensa: "72%", centrocampista: "56%", delantero: "40%" };

  function repartirEnFilas(cantidad) {
    const filas = [0, 0, 0];
    for (let i = 0; i < cantidad; i++) filas[i % 3]++;
    filas.sort((a, b) => b - a);
    return filas;
  }

  function posicionesEnCampo(numJugadores, alturas) {
    const posiciones = [{ top: alturas.portero, left: "50%" }];
    const filas = repartirEnFilas(numJugadores - 1);
    const alturaFilas = [alturas.defensa, alturas.centrocampista, alturas.delantero];
    filas.forEach((cantidadFila, indiceFila) => {
      for (let i = 0; i < cantidadFila; i++) {
        const hueco = 100 / (cantidadFila + 1);
        posiciones.push({ top: alturaFilas[indiceFila], left: `${hueco * (i + 1)}%` });
      }
    });
    return posiciones;
  }

  const RUTAS_CAMISETA = {
    local: "assets/camiseta-local-v4.png",
    visitante: "assets/camiseta-visitante-v4.png",
    portero: "assets/camiseta-portero-v4.png",
  };

  function crearTarjetaJugador(jugador, esPartidoLocal) {
    const ruta = jugador.portero ? RUTAS_CAMISETA.portero
      : esPartidoLocal ? RUTAS_CAMISETA.local : RUTAS_CAMISETA.visitante;
    const tarjeta = document.createElement("div");
    tarjeta.className = "tarjeta-jugador";
    tarjeta.innerHTML = `
      <img class="camiseta-fondo" src="${ruta}" />
      <div class="dorsal-tarjeta">${jugador.dorsal}</div>
      <div class="nombre-tarjeta">${jugador.nombre}</div>
      ${jugador.capitan ? '<div class="capitan-tarjeta">C</div>' : ''}
    `;
    return tarjeta;
  }

  let esLocal = true;
  const cont = document.getElementById("jugadores");
  const estadoFase = document.getElementById("estadoFase");

  async function reproducir() {
    cont.innerHTML = "";
    document.getElementById("fondo").src = esLocal ? "assets/campo-local-v4.jpg" : "assets/campo-generico-v4.jpg";

    const posAmplias = posicionesEnCampo(alineacion.length, ALTURAS_AMPLIO);
    const posCompactas = posicionesEnCampo(alineacion.length, ALTURAS_COMPACTO);

    estadoFase.textContent = "Fase 1: presentación...";
    alineacion.forEach((jugador, i) => {
      const el = document.createElement("div");
      el.className = "jugador";
      el.style.top = posAmplias[i].top;
      el.style.left = posAmplias[i].left;
      el.style.animationDelay = `${i * 0.12}s`;
      el.appendChild(crearTarjetaJugador(jugador, esLocal));
      cont.appendChild(el);
      void el.offsetWidth;
      el.classList.add("aparece");
    });

    await new Promise(r => setTimeout(r, 1800));

    estadoFase.textContent = "Fase 2: contrayendo hacia el terreno de juego...";
    const elementos = cont.querySelectorAll(".jugador");
    elementos.forEach((el, i) => {
      el.style.top = posCompactas[i].top;
      el.style.left = posCompactas[i].left;
    });

    await new Promise(r => setTimeout(r, 1200));
    estadoFase.textContent = "Fase 2 completa — así se queda.";
  }

  document.getElementById("btnLocal").addEventListener("click", () => { esLocal = true; reproducir(); });
  document.getElementById("btnGenerico").addEventListener("click", () => { esLocal = false; reproducir(); });
  document.getElementById("btnReiniciar").addEventListener("click", reproducir);

  reproducir();
</script>

</body>
</html>
