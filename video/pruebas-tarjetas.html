<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>PRUEBA — tarjetas flotantes sobre el campo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: #04140a;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    overflow: hidden;
  }

  #campo {
    position: relative;
    width: 1080px;
    height: 1920px;
  }
  #campo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .jugador {
    position: absolute;
    transform: translate(-50%, -50%);
    opacity: 0; /* la animación lo hace visible */
  }

  /* Entrada: aparece con un pequeño "pop" — como en el vídeo de
     referencia, no aparecen todos a la vez sino uno detrás de otro
     (el retraso de cada uno se pone por JS, más abajo). */
  @keyframes aparecer {
    from {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5) translateY(10px);
    }
    to {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) translateY(0);
    }
  }
  .jugador.aparece {
    animation: aparecer 0.45s cubic-bezier(.34, 1.56, .64, 1) forwards;
  }

  /* La tarjeta ES la camiseta — no dos cosas separadas. La imagen
     va dentro como capa de fondo, número y nombre encima. */
  .tarjeta-jugador {
    position: relative;
    width: 104px;
    height: 138px;
    background: rgba(8, 8, 8, 0.55);
    border: 2px solid rgba(244, 196, 48, 0.7);
    border-radius: 13px;
    overflow: hidden;
    box-shadow: 0 5px 12px rgba(0,0,0,0.5);
  }

  .tarjeta-jugador .camiseta-fondo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center 60%;
  }

  .tarjeta-jugador .dorsal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 34px;
    font-weight: 900;
    color: #F4B400;
    text-shadow:
      -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000,
      -1.5px  1.5px 0 #000, 1.5px  1.5px 0 #000;
    line-height: 1;
  }

  .tarjeta-jugador .nombre {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.72);
    color: #F6EFDD;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    padding: 3px 2px;
    line-height: 1.15;
  }
</style>
</head>
<body>

<div id="campo">
  <img src="assets/campo-generico-v4.jpg" alt="" />
  <div id="jugadores"></div>
</div>

<script>
  // Datos de ejemplo — cámbialos por los que quieras probar.
  const alineacion = [
    { dorsal: 1,  nombre: "GONZÁLEZ", top: "80%", left: "50%" },

    { dorsal: 4,  nombre: "MARTÍN",   top: "64%", left: "22%" },
    { dorsal: 5,  nombre: "SÁNCHEZ",  top: "66%", left: "50%" },
    { dorsal: 6,  nombre: "LÓPEZ",    top: "64%", left: "78%" },

    { dorsal: 8,  nombre: "GARCÍA",   top: "48%", left: "20%" },
    { dorsal: 10, nombre: "RUIZ",     top: "48%", left: "50%" },
    { dorsal: 7,  nombre: "DÍAZ",     top: "48%", left: "80%" },

    { dorsal: 11, nombre: "MORENO",   top: "34%", left: "18%" },
    { dorsal: 15, nombre: "VEGA",     top: "34%", left: "38%" },
    { dorsal: 9,  nombre: "TORRES",   top: "34%", left: "62%" },
    { dorsal: 17, nombre: "ROMERO",   top: "34%", left: "82%" },
  ];

  const cont = document.getElementById("jugadores");

  alineacion.forEach((j, i) => {
    const el = document.createElement("div");
    el.className = "jugador";
    el.style.top = j.top;
    el.style.left = j.left;
    // Cada jugador aparece un poco después que el anterior —
    // el "goteo" que se ve en el vídeo de referencia.
    el.style.animationDelay = `${i * 0.12}s`;
    el.innerHTML = `
      <div class="tarjeta-jugador">
        <img class="camiseta-fondo" src="assets/camiseta-local-v4.png" />
        <div class="dorsal">${j.dorsal}</div>
        <div class="nombre">${j.nombre}</div>
      </div>
    `;
    cont.appendChild(el);

    // Forzamos el reflow antes de añadir la clase, para que la
    // animación se dispare de verdad (si no, a veces el navegador
    // se la salta por haberla puesto ya en el mismo frame).
    void el.offsetWidth;
    el.classList.add("aparece");
  });
</script>

</body>
</html>
