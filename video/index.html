<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vídeo del partido</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Lienzo de 1080x1920 (formato vertical, historia de Instagram).
    Todo se dibuja dentro de #escena; styles.css lo escala para
    que se vea entero en la ventana del navegador.
  -->
  <div id="escena">

    <!-- Cabecera fija, estilo cartel de calendario. Visible en
         todo el vídeo. -->
    <header id="cabecera-club">
      <img id="escudo-club" src="" alt="Escudo del club" />
      <div id="cabecera-texto">
        <div id="cabecera-titulo">RESULTADO<br />FINAL</div>
        <div id="cabecera-categoria"></div>
      </div>
    </header>

    <!-- Pantalla 1: marcador -->
    <section id="pantalla-resultado" class="pantalla"></section>

    <!-- Pantalla 2: alineación (lista -> campo) -->
    <section id="pantalla-alineacion" class="pantalla oculta">
      <div id="campo"></div>
      <div id="jugadores"></div>
    </section>

    <!-- Pantalla 3: goles, en dos columnas (propios / rival) -->
    <section id="pantalla-goles" class="pantalla oculta">
      <div id="goles-cabecera">GOLES</div>
      <div id="goles-columnas">
        <div class="columna-goles">
          <div id="goles-nombre-propio" class="columna-goles-nombre"></div>
          <div id="lista-goles-propios" class="lista-goles"></div>
        </div>
        <div class="columna-goles">
          <div id="goles-nombre-rival" class="columna-goles-nombre"></div>
          <div id="lista-goles-rival" class="lista-goles"></div>
        </div>
      </div>
    </section>

    <!-- Pantalla 4: mascota + bocadillo de resumen -->
    <section id="pantalla-mascota" class="pantalla oculta">
      <img id="img-mascota" src="" alt="Mascota del club" />
      <div id="bocadillo-mascota">
        <div id="lista-resumen"></div>
      </div>
    </section>

  </div>

  <script src="animacion.js"></script>
</body>
</html>
