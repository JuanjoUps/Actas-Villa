<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vídeo del partido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Lienzo de 1080x1920 (formato vertical, historia de Instagram).
    Todo se construye en un único plano continuo: cada bloque
    aparece con el tiempo pero NO se oculta el anterior — así no
    hay "saltos" entre pantallas.
  -->
  <div id="escena">

    <!-- Cabecera fija, estilo cartel de calendario. Siempre visible. -->
    <header id="cabecera-club">
      <img id="escudo-club" src="" alt="Escudo del club" />
      <div id="cabecera-texto">
        <div id="cabecera-titulo">RESULTADO<br />FINAL</div>
        <div id="cabecera-categoria"></div>
      </div>
    </header>

    <!-- Marcador + campo/alineación + goles: crecen hacia abajo desde
         la cabecera. La mascota y el banner van FIJOS al fondo del
         lienzo (ver más abajo), no dependen de cuánto ocupe esto. -->
    <div id="contenido-medio">

      <!-- Marcador -->
      <section id="bloque-resultado" class="bloque"></section>

      <!-- Campo + alineación (lista -> formación) -->
      <section id="bloque-alineacion" class="bloque">
        <div id="campo-envoltura">
          <div id="campo">
            <div class="foco arriba-izq"></div>
            <div class="foco arriba-der"></div>
            <div class="porteria arriba"></div>
            <div class="circulo-central"></div>
            <div class="linea-medio-campo"></div>
            <div class="porteria abajo"></div>
            <div id="jugadores"></div>
          </div>
          <div id="panel-suplentes">
            <div id="suplentes-titulo">SUPLENTES</div>
            <div id="lista-suplentes"></div>
          </div>
        </div>
      </section>

      <!-- Goles, en dos columnas -->
      <section id="bloque-goles" class="bloque">
        <div id="goles-cabecera">GOLES</div>
        <div id="goles-columnas">
          <div class="columna-goles">
            <div id="goles-nombre-propio" class="columna-goles-nombre"></div>
            <div id="lista-goles-propios" class="lista-goles"></div>
          </div>
          <div class="columna-goles">
            <div id="goles-nombre-rival" class="columna-goles-nombre"></div>
            <div id="lista-goles-rival" class="lista-goles"></div>
          </div>
        </div>
      </section>

    </div>

    <!-- Mascota + bocadillo: FIJA, siempre pegada justo encima del
         banner, sea lo que sea lo que haya pasado arriba. -->
    <section id="bloque-mascota" class="bloque">
      <img id="img-mascota" src="" alt="Mascota del club" />
      <div id="bocadillo-mascota">
        <div id="lista-resumen"></div>
      </div>
    </section>

    <!-- Banner de patrocinadores: FIJO, siempre en el mismo sitio. -->
    <footer id="banner-patrocina">
      <div id="patrocina-texto">
        ¿QUIERES QUE TU MARCA<br />APAREZCA CADA SEMANA?
      </div>
      <div id="patrocina-accion">
        PATROCINA NUESTRO CONTENIDO<br />DE PARTIDOS
      </div>
    </footer>

  </div>

  <script src="animacion.js"></script>
</body>
</html>
